_anchors:
  policies:
    - &admin_bypass
      name: platform_admin_bypass
      description: Platform administrators may recover and administer Bifrost Docs data.
      actions: [read, create, update, delete]
      when: {user: is_platform_admin}
    - &tenant_read
      name: docs_tenant_read
      description: Provider users see all clients; customer roles see their organization only.
      actions: [read]
      when:
        and:
          - or:
              - {call: has_role, args: ["Bifrost Docs Reader"]}
              - {call: has_role, args: ["Bifrost Docs Editor"]}
              - {call: has_role, args: ["Bifrost Docs Administrator"]}
          - or:
              - {user: is_provider_org}
              - eq: [{row: organization_id}, {user: organization_id}]
    - &tenant_read_unrestricted
      name: docs_tenant_read_unrestricted
      description: Restricted records are visible only to Docs administrators.
      actions: [read]
      when:
        and:
          - or:
              - {call: has_role, args: ["Bifrost Docs Reader"]}
              - {call: has_role, args: ["Bifrost Docs Editor"]}
              - {call: has_role, args: ["Bifrost Docs Administrator"]}
          - or:
              - {user: is_provider_org}
              - eq: [{row: organization_id}, {user: organization_id}]
          - or:
              - eq: [{row: restricted}, false]
              - {call: has_role, args: ["Bifrost Docs Administrator"]}
    - &tenant_editor_write
      name: docs_tenant_editor_write
      description: Docs editors may author and edit records for their organization; provider editors may work across organizations.
      actions: [create, update, delete]
      when:
        and:
          - or:
              - {call: has_role, args: ["Bifrost Docs Editor"]}
              - {call: has_role, args: ["Bifrost Docs Administrator"]}
          - or:
              - {user: is_provider_org}
              - eq: [{row: organization_id}, {user: organization_id}]
    - &tenant_editor_write_unrestricted
      name: docs_tenant_editor_write_unrestricted
      description: Editors can change unrestricted content; restricted content remains administrator-only.
      actions: [create, update, delete]
      when:
        and:
          - or:
              - {user: is_provider_org}
              - eq: [{row: organization_id}, {user: organization_id}]
          - or:
              - {call: has_role, args: ["Bifrost Docs Administrator"]}
              - and:
                  - {call: has_role, args: ["Bifrost Docs Editor"]}
                  - eq: [{row: restricted}, false]
    - &migration_admin
      name: docs_migration_admin
      description: Only platform administrators or provider Docs administrators operate migrations.
      actions: [read, create, update, delete]
      when:
        or:
          - {user: is_platform_admin}
          - and:
              - {user: is_provider_org}
              - {call: has_role, args: ["Bifrost Docs Administrator"]}
    - &taxonomy_admin
      name: docs_configuration_taxonomy_admin
      description: Only platform administrators or provider Docs administrators manage configuration taxonomy.
      actions: [create, update, delete]
      when:
        or:
          - {user: is_platform_admin}
          - and:
              - {user: is_provider_org}
              - {call: has_role, args: ["Bifrost Docs Administrator"]}

tables:
  6be75c9e-91b1-4f67-a070-15e12b205011:
    id: 6be75c9e-91b1-4f67-a070-15e12b205011
    name: docs-file-org-grants
    description: Immutable organization path prefixes used by customer file policies.
    schema:
      columns:
        - {name: organization_id, type: string}
        - {name: path_prefix, type: string}
    policies:
      - *admin_bypass
      - *tenant_read
      - *migration_admin
      - name: docs_safe_file_grant_create
        description: Docs editors may establish only their own organization's exact file prefix.
        actions: [create]
        when:
          and:
            - or:
                - {call: has_role, args: ["Bifrost Docs Editor"]}
                - {call: has_role, args: ["Bifrost Docs Administrator"]}
            - or:
                - {user: is_provider_org}
                - eq: [{row: organization_id}, {user: organization_id}]
            - eq: [{row: path_prefix}, {row: organization_id}]

